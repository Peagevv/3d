<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Bienvenido a Games FPS</title>

    <!-- Enlace a Bootstrap para diseño y estilo -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <!-- Enlace a un archivo CSS personalizado (si lo tienes) -->
    <link rel="stylesheet" href="styles.css">

    <!-- Estilos adicionales para personalización -->
    <style>
        body {
            background-color: #f4f4f9;
            font-family: 'Arial', sans-serif;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .btn-custom {
            background-color: #007bff;
            color: white;
            font-size: 18px;
            padding: 15px 30px;
            border-radius: 8px;
            border: none;
            transition: background-color 0.3s ease;
        }

        .btn-custom:hover {
            background-color: #0056b3;
        }

        .header-text {
            text-align: center;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <!-- Contenedor principal -->
    <div class="container">
        <!-- Encabezado -->
        <div class="header-text">
            <h1>¡Bienvenido a Games FPS!</h1>
            <p>Haz clic en el siguiente botón para acceder al proyecto interactivo de Games FPS.</p>
        </div>

        <!-- Botón para redirigir al proyecto -->
        <a href="https://peagevv.github.io/3d/examples/games_fps.html" target="_blank" class="btn btn-custom">
            Acceder al Proyecto Games FPS
        </a>
    </div>

    <!-- Scripts de Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
